name: Publish APK Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish_release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact from build run 45325520621
        uses: actions/download-artifact@v4
        with:
          name: ai-wardrobe-arm64-v8a-release-apk
          path: ./artifact
          run-id: 45325520621
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release v1.1.0 with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh ./artifact/
          gh release create v1.1.0 ./artifact/app-arm64-v8a-release.apk \
            --title "AI 电子衣橱 v1.1.0" \
            --notes "合并版：实时多件试衣镜、三层抠图、打分推荐" \
            --latest
