name: ai_wardrobe
description: 全本地离线 AI 电子衣橱与智能穿搭助手（阶段一 + 阶段二实时 AR 试穿）
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 本地 SQLite 数据库 (Drift)
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.5
  path: ^1.9.1

  # 极简双列瀑布流 UI
  flutter_staggered_grid_view: ^0.7.0

  # 图像采集、实时摄像头与像素级处理
  image_picker: ^1.1.2
  camera: ^0.12.0+2
  image: ^4.5.4

  # 端侧离线 AI 推理与图像算法（零云端付费 API）
  flutter_onnxruntime: ^1.8.5
  google_mlkit_pose_detection: ^1.0.3
  google_mlkit_subject_segmentation: ^0.3.2
  opencv_dart: ^2.2.1+4

  # 定位与免费天气接口 (Open-Meteo)
  geolocator: ^13.0.2
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.10.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/rules/
